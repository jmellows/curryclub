<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Details - Beachlands Curry Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="detailPage">
    <div class="detail-container">
        <button class="back-btn" id="backBtn">← Back</button>
        <h1 class="detail-restaurant-name" id="detailRestaurantName"></h1>

        <div class="rating-categories">
            <div class="category-rating">
                <h3>Meal</h3>
                <div class="rating-display">
                    <div class="curry-bowls" id="mealRating"></div>
                    <div class="rating-number" id="mealNumber"></div>
                </div>
            </div>
            <div class="category-rating">
                <h3>Bathroom</h3>
                <div class="rating-display">
                    <div class="curry-bowls" id="bathroomRating"></div>
                    <div class="rating-number" id="bathroomNumber"></div>
                </div>
            </div>
            <div class="category-rating">
                <h3>Ambiance</h3>
                <div class="rating-display">
                    <div class="curry-bowls" id="ambianceRating"></div>
                    <div class="rating-number" id="ambianceNumber"></div>
                </div>
            </div>
            <div class="category-rating">
                <h3>Service</h3>
                <div class="rating-display">
                    <div class="curry-bowls" id="serviceRating"></div>
                    <div class="rating-number" id="serviceNumber"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="detail.js"></script>
</body>
</html>
