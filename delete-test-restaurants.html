<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Test Restaurants</title>
    <style>
        body {
            font-family: monospace;
            padding: 40px;
            background: #1e1e1e;
            color: #00ff00;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 20px;
        }
        .login-form {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #1e1e1e;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            border-radius: 4px;
        }
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
        }
        button:hover {
            background: #ff8c52;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #output {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #00ff00;
            white-space: pre-wrap;
            font-family: monospace;
            min-height: 200px;
        }
        .warning {
            color: #ff6b35;
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid #ff6b35;
            border-radius: 8px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delete Test Restaurants</h1>

        <div class="warning">
            ⚠️ This will permanently delete restaurants named "test3", "test4", or "tesg3" from the database.
        </div>

        <div id="loginSection" class="login-form">
            <h3 style="margin-bottom: 15px;">Admin Login Required</h3>
            <input type="email" id="adminEmail" placeholder="Admin Email" value="jmellowsjnr@gmail.com">
            <input type="password" id="adminPassword" placeholder="Admin Password">
            <button onclick="login()">Login as Admin</button>
        </div>

        <div id="deleteSection" class="hidden">
            <button onclick="loadRestaurants()">Load All Restaurants</button>
            <div id="restaurantList" style="background: #000; padding: 20px; border-radius: 8px; border: 2px solid #00ff00; margin-top: 20px; max-height: 400px; overflow-y: auto;"></div>
            <button onclick="deleteSelected()" id="deleteBtn" class="hidden" style="margin-top: 20px; background: #dc3545;">Delete Selected</button>
        </div>

        <div id="output">Waiting for admin login...</div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import {
            getFirestore,
            collection,
            getDocs,
            deleteDoc,
            doc
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBUHbaZnPKBA4pZ5YRwZmHwoB-68I5LKEg",
            authDomain: "beachlands-curry-club.firebaseapp.com",
            projectId: "beachlands-curry-club",
            storageBucket: "beachlands-curry-club.firebasestorage.app",
            messagingSenderId: "797609017294",
            appId: "1:797609017294:web:e7161e1442036a483ff59f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.login = async function() {
            const output = document.getElementById('output');
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            output.textContent = 'Logging in...\n';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                output.textContent += '✅ Logged in as admin!\n\nReady to delete test restaurants.\n';

                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('deleteSection').classList.remove('hidden');
            } catch (error) {
                output.textContent += `❌ Login failed: ${error.message}\n`;
            }
        }

        let allRestaurantsData = [];

        window.loadRestaurants = async function() {
            const output = document.getElementById('output');
            const listDiv = document.getElementById('restaurantList');
            const deleteBtn = document.getElementById('deleteBtn');

            output.textContent = 'Loading all restaurants...\n';
            listDiv.innerHTML = '';

            try {
                const restaurantsSnapshot = await getDocs(collection(db, 'restaurants'));
                allRestaurantsData = [];

                output.textContent = `📊 Found ${restaurantsSnapshot.docs.length} restaurants in database\n\n`;

                if (restaurantsSnapshot.docs.length === 0) {
                    listDiv.innerHTML = '<p style="color: #999;">No restaurants in database</p>';
                    return;
                }

                let html = '<div style="color: #00ff00;">';

                restaurantsSnapshot.docs.forEach(doc => {
                    const data = doc.data();
                    allRestaurantsData.push({
                        id: doc.id,
                        name: data.name
                    });

                    html += `
                        <div style="padding: 8px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" id="rest_${doc.id}" value="${doc.id}" style="width: 20px; height: 20px; cursor: pointer;">
                            <label for="rest_${doc.id}" style="cursor: pointer; flex: 1;">"${data.name}" <span style="color: #666; font-size: 11px;">(ID: ${doc.id})</span></label>
                        </div>
                    `;
                });

                html += '</div>';
                listDiv.innerHTML = html;
                deleteBtn.classList.remove('hidden');

                output.textContent += '✅ Select restaurants to delete and click "Delete Selected"';

            } catch (error) {
                output.textContent = `❌ Error loading restaurants: ${error.message}\n`;
                console.error('Error:', error);
            }
        }

        window.deleteSelected = async function() {
            const output = document.getElementById('output');
            const checkboxes = document.querySelectorAll('#restaurantList input[type="checkbox"]:checked');

            if (checkboxes.length === 0) {
                output.textContent = '⚠️  No restaurants selected for deletion\n';
                return;
            }

            if (!confirm(`Are you sure you want to delete ${checkboxes.length} restaurant(s)? This cannot be undone!`)) {
                return;
            }

            output.textContent = `Deleting ${checkboxes.length} restaurant(s)...\n\n`;

            let deletedCount = 0;
            let errorCount = 0;

            for (const checkbox of checkboxes) {
                const restaurantId = checkbox.value;
                const restaurant = allRestaurantsData.find(r => r.id === restaurantId);

                try {
                    output.textContent += `🎯 Deleting: "${restaurant.name}"\n`;

                    // Delete all ratings first
                    const ratingsSnapshot = await getDocs(collection(db, 'restaurants', restaurantId, 'ratings'));
                    output.textContent += `   ├─ Deleting ${ratingsSnapshot.size} ratings...\n`;

                    for (const ratingDoc of ratingsSnapshot.docs) {
                        await deleteDoc(ratingDoc.ref);
                    }

                    // Delete the restaurant document
                    await deleteDoc(doc(db, 'restaurants', restaurantId));
                    output.textContent += `   └─ ✅ Deleted!\n\n`;

                    deletedCount++;
                } catch (error) {
                    output.textContent += `   └─ ❌ Error: ${error.message}\n\n`;
                    errorCount++;
                }
            }

            output.textContent += '\n═══════════════════════════════════\n';
            output.textContent += `✅ COMPLETE!\n`;
            output.textContent += `   Deleted: ${deletedCount}\n`;
            if (errorCount > 0) {
                output.textContent += `   Errors: ${errorCount}\n`;
            }

            // Reload the list
            await loadRestaurants();
        }
    </script>
</body>
</html>
