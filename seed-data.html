<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Demo Data - Beachlands Curry Club</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff6b35;
        }
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .error {
            background: #fee;
            color: #c33;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <h1>Seed Demo Data</h1>
    <p>This will create 5 demo restaurants with ratings for testing.</p>

    <button id="seedBtn">Create 5 Demo Restaurants</button>
    <button id="clearBtn" style="background: #f44336;">Clear All Restaurants</button>

    <div id="status"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            onAuthStateChanged
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import {
            getFirestore,
            collection,
            addDoc,
            setDoc,
            doc,
            getDocs,
            deleteDoc,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBUHbaZnPKBA4pZ5YRwZmHwoB-68I5LKEg",
            authDomain: "beachlands-curry-club.firebaseapp.com",
            projectId: "beachlands-curry-club",
            storageBucket: "beachlands-curry-club.firebasestorage.app",
            messagingSenderId: "797609017294",
            appId: "1:797609017294:web:e7161e1442036a483ff59f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                window.location.href = '/';
            }
        });

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
        }

        const demoRestaurants = [
            {
                name: "Spice Paradise",
                ratings: [
                    { meal: 9, bathroom: 8, ambiance: 9, service: 9 },
                    { meal: 10, bathroom: 7, ambiance: 8, service: 9 },
                    { meal: 9, bathroom: 9, ambiance: 9, service: 10 }
                ]
            },
            {
                name: "The Curry House",
                ratings: [
                    { meal: 8, bathroom: 7, ambiance: 8, service: 8 },
                    { meal: 9, bathroom: 8, ambiance: 7, service: 8 },
                ]
            },
            {
                name: "Bombay Dreams",
                ratings: [
                    { meal: 7, bathroom: 8, ambiance: 8, service: 7 },
                    { meal: 8, bathroom: 7, ambiance: 9, service: 8 },
                    { meal: 7, bathroom: 8, ambiance: 7, service: 7 }
                ]
            },
            {
                name: "Tandoori Flame",
                ratings: [
                    { meal: 6, bathroom: 6, ambiance: 7, service: 7 },
                    { meal: 7, bathroom: 7, ambiance: 6, service: 6 }
                ]
            },
            {
                name: "Masala Junction",
                ratings: [
                    { meal: 5, bathroom: 6, ambiance: 6, service: 5 },
                    { meal: 6, bathroom: 5, ambiance: 5, service: 6 },
                ]
            }
        ];

        document.getElementById('seedBtn').addEventListener('click', async () => {
            if (!currentUser) {
                showStatus('Please login first!', 'error');
                return;
            }

            if (!confirm('Create 5 demo restaurants with ratings?')) return;

            showStatus('Creating demo restaurants...', 'info');

            try {
                for (let i = 0; i < demoRestaurants.length; i++) {
                    const restaurant = demoRestaurants[i];

                    // Create restaurant
                    const restaurantRef = await addDoc(collection(db, 'restaurants'), {
                        name: restaurant.name,
                        createdBy: currentUser.uid,
                        createdAt: serverTimestamp()
                    });

                    // Add ratings
                    for (let j = 0; j < restaurant.ratings.length; j++) {
                        const rating = restaurant.ratings[j];
                        await setDoc(doc(db, 'restaurants', restaurantRef.id, 'ratings', `demo-user-${j}`), {
                            meal: rating.meal,
                            bathroom: rating.bathroom,
                            ambiance: rating.ambiance,
                            service: rating.service,
                            userId: `demo-user-${j}`,
                            userName: `Demo User ${j + 1}`,
                            updatedAt: serverTimestamp()
                        });
                    }

                    showStatus(`Created ${i + 1}/${demoRestaurants.length} restaurants...`, 'info');
                }

                showStatus('✅ Successfully created 5 demo restaurants! Go to dashboard to see them.', 'success');
            } catch (error) {
                console.error('Error seeding data:', error);
                showStatus('Error creating restaurants: ' + error.message, 'error');
            }
        });

        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (!confirm('⚠️ DELETE ALL RESTAURANTS? This cannot be undone!')) return;
            if (!confirm('Are you REALLY sure? This will delete everything!')) return;

            showStatus('Deleting all restaurants...', 'info');

            try {
                const restaurantsSnapshot = await getDocs(collection(db, 'restaurants'));

                for (const restaurantDoc of restaurantsSnapshot.docs) {
                    // Delete all ratings
                    const ratingsSnapshot = await getDocs(collection(db, 'restaurants', restaurantDoc.id, 'ratings'));
                    for (const ratingDoc of ratingsSnapshot.docs) {
                        await deleteDoc(ratingDoc.ref);
                    }

                    // Delete restaurant
                    await deleteDoc(restaurantDoc.ref);
                }

                showStatus('✅ All restaurants deleted!', 'success');
            } catch (error) {
                console.error('Error deleting data:', error);
                showStatus('Error deleting restaurants: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
